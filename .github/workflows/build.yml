name: Build public TraySuite

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packages:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-2025
          - rid: win-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    env:
      TRAYSUITE_STORE_ID: ${{ vars.TRAYSUITE_STORE_ID }}
      TRAYSUITE_PRODUCT_ID: ${{ vars.TRAYSUITE_PRODUCT_ID }}
      TRAYSUITE_CHECKOUT_URL: ${{ vars.TRAYSUITE_CHECKOUT_URL }}
      TRAYSUITE_DOWNLOADS_URL: ${{ vars.TRAYSUITE_DOWNLOADS_URL }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check the public source tree
        shell: pwsh
        run: |
          if (git ls-files -- pro artifacts) {
            throw 'The public checkout contains private source or build artifacts.'
          }
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Build public solution independently
        run: dotnet build public/TraySuite.sln -c Release -warnaserror
      - name: Build Free ZIPs and Hub installer from the catalog
        run: python installer/build.py build --scope public --runtime ${{ matrix.rid }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ matrix.rid }}
          path: |
            artifacts/public/${{ matrix.rid }}/*-Setup.exe
            artifacts/public/${{ matrix.rid }}/*.zip
            artifacts/public/${{ matrix.rid }}/manifest-${{ matrix.rid }}.json
          if-no-files-found: error
      - name: Test installer and module lifecycle through the Hub UI
        shell: powershell
        run: ./installer/Smoke-Test.ps1 -Runtime ${{ matrix.rid }}

  manifest:
    needs: packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: win-*
          path: artifacts/public
      - run: python installer/build.py merge --scope public --inputs artifacts/public --output artifacts/release
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: public-manifest
          path: artifacts/release/manifest.json
          if-no-files-found: error
