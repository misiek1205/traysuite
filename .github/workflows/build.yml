name: Build for Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - rid: win-x64
            runner: windows-2025
          - rid: win-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Build installer and portable ZIP
        shell: pwsh
        run: ./installer/Build-Installer.ps1 -Runtime ${{ matrix.rid }}
      - name: Verify installation, startup preference and removal
        shell: pwsh
        run: |
          $setup = (Get-ChildItem "artifacts/${{ matrix.rid }}/*-Setup.exe").FullName
          $directory = Join-Path $env:RUNNER_TEMP 'Dimmli smoke test'
          $app = Join-Path $directory 'Dimmli.exe'
          $runKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'

          function Install-Dimmli {
            $process = Start-Process $setup -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$directory`"" -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Setup failed with exit code $($process.ExitCode)." }
          }

          Install-Dimmli
          $command = (Get-ItemProperty $runKey).Brightness
          if ($command -ne "`"$app`"") { throw 'Setup did not register the installed app for startup.' }

          $process = Start-Process $command.Trim('"') -PassThru
          try {
            if ($process.WaitForExit(5000)) {
              throw "Dimmli exited during startup with status $($process.ExitCode)."
            }
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id
              $process.WaitForExit()
            }
          }

          Remove-ItemProperty $runKey Brightness
          $legacyExecutable = Join-Path $directory 'TrayLuminance.exe'
          New-Item -ItemType File -Path $legacyExecutable | Out-Null
          Install-Dimmli
          if ((Get-ItemProperty $runKey).Brightness) { throw 'Setup re-enabled startup during an upgrade.' }
          if (Test-Path $legacyExecutable) { throw 'Upgrade left the previous executable in place.' }

          Set-ItemProperty $runKey Brightness $command
          $uninstaller = (Get-ChildItem "$directory/unins*.exe").FullName
          $process = Start-Process $uninstaller -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait -PassThru
          if ($process.ExitCode -ne 0 -or (Test-Path $app) -or (Get-ItemProperty $runKey).Brightness) {
            throw 'Uninstall did not remove the app and its startup entry.'
          }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Dimmli-${{ matrix.rid }}
          path: |
            artifacts/${{ matrix.rid }}/*-Setup.exe
            artifacts/${{ matrix.rid }}/*.zip
          if-no-files-found: error
